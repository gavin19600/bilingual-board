<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이중언어 칠판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style id="css">
/* 배치: 크림색 책상 위에 흰 카드 두 장. 왼쪽 카드는 자료 종이와 오른쪽 가장자리의 크레용 통, 아래에는 둥근 도구 버튼. 밝은 한 가지 테마로 고정. */
:root{
  color-scheme:light;
  --bg:#fff5e4; --card:#ffffff; --ink:#3b2f27; --dim:#86766a; --line:#f1dfc5; --soft:#fff9ee;
  --tray:#dcf0f6; --tray-edge:#b9dcea; --accent:#ffb84d; --accent-ink:#4a2a00; --tx:#0b6b78; --warn:#c0392b;
  --display:"Jua","Noto Sans KR",system-ui,sans-serif;
  --body:"Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
  --tr-size:1.3rem;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--tx);outline-offset:2px}
[hidden]{display:none !important}
#teach-btn{display:none}
.student #teach-btn{display:inline-flex}
.student .file-label,.student #paste-btn,.student #send,.student #qr-btn,.student #lang,.student #go,.student #asimg,.student #trpaste,.student .ws{display:none !important}
#qr-box{display:flex;justify-content:center;padding:12px;background:#fff;border-radius:14px;margin-bottom:10px}
#qr-box svg{width:min(260px,70vw);height:auto;stroke:none;fill:initial}
#qr-url{word-break:break-all;text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}

.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 16px}
.top h1{font-family:var(--display);font-weight:400;font-size:1.7rem;line-height:1.1;margin:0;margin-right:auto;color:var(--ink)}
.top h1::after{content:"";display:block;height:6px;border-radius:3px;margin-top:3px;background:linear-gradient(90deg,#ff6b6b 0 20%,#ffb84d 20% 40%,#51cf66 40% 60%,#4dabf7 60% 80%,#b197fc 80%)}
.top-ctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border:2px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn[disabled]{opacity:.4;cursor:default}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
select{min-height:44px;padding:0 12px;border:2px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);max-width:100%}
.file-label:focus-within{outline:3px solid var(--tx);outline-offset:2px}
.group{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

main{flex:1;min-height:0;display:grid;gap:14px;padding:0 14px 14px;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
main.view-board{grid-template-columns:minmax(0,1fr)} main.view-board .tr-pane{display:none}
main.view-tr{grid-template-columns:minmax(0,1fr)} main.view-tr .board-pane{display:none}

.pane{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;border-radius:26px;border:2px solid var(--line);background:var(--card);box-shadow:0 8px 24px rgba(160,110,40,.12)}
.strip{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;padding:12px 16px 6px}
.strip .btn{min-height:40px;padding:0 12px}
.mid{font-variant-numeric:tabular-nums;color:var(--dim);min-width:3.2em;text-align:center}
.note{padding:0 18px 6px;font-size:.92rem;color:var(--dim)}
.note.err{color:var(--warn)}

.work{flex:1;min-height:0;display:flex}
.stage{flex:1;min-width:0;min-height:0;overflow:auto;padding:10px 16px 18px;background:var(--soft)}
.sheet{position:relative;margin:0 auto;background:#fff;border-radius:6px;box-shadow:0 4px 16px rgba(120,80,30,.18);line-height:0}
.sheet canvas{display:block;width:100%;height:auto;border-radius:6px}
#ink{position:absolute;inset:0;height:100%;touch-action:none;cursor:crosshair}
#ink.hand{touch-action:auto;pointer-events:none}

/* 크레용 통 */
.crayons{flex:none;width:92px;display:flex;flex-direction:column;align-items:flex-end;gap:9px;padding:16px 0 12px;background:var(--tray);border-left:2px solid var(--tray-edge);overflow-x:hidden;overflow-y:auto}
.sw{flex:none;width:80px;height:28px;border:0;padding:0;cursor:pointer;border-radius:0 6px 6px 0;clip-path:polygon(0 50%,24% 0,100% 0,100% 100%,24% 100%);transform:translateX(18px)}
.sw:hover,.sw:focus-visible{transform:translateX(9px)}
.sw[aria-pressed="true"]{transform:translateX(0)}
#custom{flex:none;width:46px;height:46px;margin:auto 22px 0 0;padding:0;border:3px solid #fff;border-radius:50%;background:conic-gradient(#ff6b6b,#ffb84d,#ffe066,#51cf66,#4dabf7,#b197fc,#ff6b6b);cursor:pointer;overflow:hidden}
#custom::-webkit-color-swatch-wrapper{padding:0}
#custom::-webkit-color-swatch{border:0;opacity:0}
#custom::-moz-color-swatch{border:0;opacity:0}

/* 도구 */
.toolbar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:center;padding:10px 12px 12px;border-top:2px solid var(--line);background:var(--card)}
.tool{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;width:62px;height:60px;padding:0;border:2px solid var(--line);border-radius:18px;background:var(--soft);color:var(--ink);cursor:pointer;font-size:.78rem;line-height:1.2}
.tool:hover{border-color:var(--accent)}
.tool[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.tool[disabled]{opacity:.38;cursor:default}
.size{display:flex;align-items:center;gap:6px;font-size:.9rem;color:var(--dim)}
.size input{width:100px;accent-color:#ff8a3d}

/* 번역 카드 */
.tr-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:14px 16px 8px}
.tr-head h2{font-family:var(--display);font-weight:400;font-size:1.45rem;line-height:1.1;margin:0;margin-right:auto}
.tr-head .btn{min-height:40px;padding:0 12px;font-size:.92rem}
.ws{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 16px 8px;padding:8px 12px;border-radius:18px;background:var(--tray);border:2px solid var(--tray-edge)}
.ws[hidden]{display:none}
.ws-label{font-family:var(--display);font-size:1.05rem;margin-right:auto}
.ws .btn{min-height:40px;padding:0 12px;font-size:.92rem}
.tr-body{flex:1;min-height:0;overflow:auto;padding:4px 16px 18px;display:flex;flex-direction:column;gap:10px}
.tr-body p{margin:0}
.tag{display:inline-block;padding:1px 9px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:.8rem;font-weight:700;vertical-align:middle}
.pair{padding:12px 16px;line-height:1.65;border-radius:18px;background:var(--soft);border:2px solid var(--line);cursor:pointer}
.ko{font-weight:500;font-size:var(--tr-size)}
.ez{font-size:calc(var(--tr-size)*.92);color:var(--dim);margin-top:4px}
.tx{color:var(--tx);font-weight:500;font-size:var(--tr-size);margin-top:4px}
.hide-ko .pair:not(.peek) .ko,.hide-ko .pair:not(.peek) .ez,.hide-tx .pair:not(.peek) .tx{filter:blur(7px);user-select:none}
.voc{margin-top:8px;padding:12px 16px;border-radius:18px;background:var(--tray);border:2px solid var(--tray-edge)}
.voc h3{font-family:var(--display);font-weight:400;font-size:1.2rem;margin:0 0 4px}
.voc-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:1.05rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--tray-edge);vertical-align:top}
tr:last-child td{border-bottom:0}
th{color:var(--dim);font-weight:500;font-size:.85rem}
td:nth-child(2){color:var(--tx);font-weight:500}
.empty{color:var(--dim);padding:8px 0}
.drop main{outline:4px dashed var(--accent);outline-offset:-6px;border-radius:26px}
dialog{width:min(560px,calc(100% - 32px));border:2px solid var(--line);border-radius:24px;background:var(--card);color:var(--ink);padding:20px}
dialog::backdrop{background:rgba(60,40,20,.45)}
dialog h2{font-family:var(--display);font-weight:400;font-size:1.45rem;margin:0 0 6px}
dialog p{margin:0 0 10px;color:var(--dim);font-size:.95rem}
dialog .note{padding:0}
textarea{width:100%;font:inherit;color:var(--ink);background:var(--soft);border:2px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px;resize:vertical}

@media (max-width:860px){
  html,body{height:auto}
  main{grid-template-columns:minmax(0,1fr)}
  .pane{overflow:visible}
  .work{flex-direction:column}
  .stage{max-height:62vh}
  .crayons{width:auto;flex-direction:row;align-items:flex-end;gap:8px;padding:8px 14px 0;border-left:0;border-top:2px solid var(--tray-edge);overflow-x:auto;overflow-y:hidden}
  .sw{width:28px;height:62px;border-radius:0 0 6px 6px;clip-path:polygon(50% 0,100% 24%,100% 100%,0 100%,0 24%);transform:translateY(16px)}
  .sw:hover,.sw:focus-visible{transform:translateY(8px)}
  .sw[aria-pressed="true"]{transform:translateY(0)}
  #custom{margin:0 0 8px auto;width:42px;height:42px}
  .tr-body{overflow:visible}
  .toolbar{position:sticky;bottom:0;z-index:5;gap:6px 10px;border-radius:0 0 24px 24px}
  .tool{width:52px;height:52px;font-size:.7rem}
}
@media (prefers-reduced-motion:no-preference){.btn,.tool{transition:border-color .12s,background .12s}.sw{transition:transform .15s}}
</style>
</head>
<body>
<template id="tpl">
<header class="top">
  <h1>이중언어 칠판</h1>
  <div class="top-ctl">
    <label class="btn primary file-label" for="file">PDF·사진 올리기<input class="sr" type="file" id="file" accept="application/pdf,.pdf,image/*" multiple></label>
    <label class="btn file-label" for="cam">카메라로 찍기<input class="sr" type="file" id="cam" accept="image/*" capture="environment"></label>
    <button class="btn" id="paste-btn">글 붙여넣기</button>
    <button class="btn primary" id="send" hidden>학생에게 보내기</button>
    <button class="btn" id="qr-btn" hidden>QR 코드</button>
    <button class="btn" id="teach-btn">선생님용으로 열기</button>
    <label class="sr" for="lang">학생 언어</label>
    <select id="lang"></select>
    <div class="group" role="group" aria-label="화면 보기">
      <button class="btn" id="v-both" data-view="both" aria-pressed="true">나란히</button>
      <button class="btn" id="v-board" data-view="board" aria-pressed="false">칠판만</button>
      <button class="btn" id="v-tr" data-view="tr" aria-pressed="false">번역만</button>
    </div>
    <button class="btn" id="full">전체 화면</button>
  </div>
</header>

<main id="main" class="view-both">
  <section class="pane board-pane" aria-label="칠판">
    <div class="strip">
      <div class="group">
        <button class="btn" id="prev">◀ 이전</button>
        <span class="mid" id="pageno">1 / 1</span>
        <button class="btn" id="next">다음 ▶</button>
      </div>
      <div class="group">
        <button class="btn" id="zout" aria-label="작게">−</button>
        <span class="mid" id="zoomv">100%</span>
        <button class="btn" id="zin" aria-label="크게">+</button>
      </div>
    </div>
    <div class="note" id="docnote"></div>
    <div class="work">
      <div class="stage" id="stage">
        <div class="sheet" id="sheet"><canvas id="pdf"></canvas><canvas id="ink" aria-label="필기 영역"></canvas></div>
      </div>
      <div class="crayons" role="group" aria-label="크레용 색" id="colors">
        <label class="sr" for="custom">다른 색 고르기</label>
        <input type="color" id="custom" value="#e8590c" title="다른 색 고르기">
      </div>
    </div>
    <div class="toolbar">
      <div class="group" role="group" aria-label="도구">
        <button class="tool" data-tool="hand" id="t-hand" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M12 2v20M2 12h20M5 9l-3 3 3 3M19 9l3 3-3 3M9 5l3-3 3 3M9 19l3 3 3-3"/></svg>이동</button>
        <button class="tool" data-tool="pen" id="t-pen" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>펜</button>
        <button class="tool" data-tool="hl" id="t-hl" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="m9 11-6 6v3h9l3-3"/><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/></svg>형광펜</button>
        <button class="tool" data-tool="eraser" id="t-eraser" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="m7 21-4.3-4.3a1 1 0 0 1 0-1.4l10-10a1 1 0 0 1 1.4 0l6.6 6.6a1 1 0 0 1 0 1.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>지우개</button>
        <button class="tool" data-tool="line" id="t-line" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M5 19 19 5"/></svg>직선</button>
        <button class="tool" data-tool="rect" id="t-rect" aria-pressed="false"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1"/></svg>네모</button>
        <button class="tool" data-tool="oval" id="t-oval" aria-pressed="false"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9" ry="6"/></svg>동그라미</button>
      </div>
      <label class="size" for="size">굵기 <input type="range" id="size" min="1" max="24" value="4"></label>
      <div class="group">
        <button class="tool" id="undo"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>되돌리기</button>
        <button class="tool" id="redo"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg>다시</button>
        <button class="tool" id="clear"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>모두 지움</button>
        <button class="tool" id="save" hidden><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 21h16"/></svg>저장</button>
      </div>
    </div>
  </section>

  <section class="pane tr-pane" aria-label="번역">
    <div class="tr-head">
      <h2 id="trtitle">번역</h2>
      <button class="btn primary" id="go">이 쪽 번역하기</button>
      <button class="btn" id="asimg" hidden>그림으로 읽어 번역</button>
      <button class="btn" id="trpaste">번역 결과 붙여넣기</button>
      <button class="btn" id="hko" aria-pressed="false">한국어 숨기기</button>
      <button class="btn" id="htx" aria-pressed="false">번역 숨기기</button>
      <button class="btn" id="fdown" aria-label="글자 작게">가−</button>
      <button class="btn" id="fup" aria-label="글자 크게">가+</button>
    </div>
    <div class="ws" id="ws" hidden>
      <span class="ws-label">학생에게 나눠 줄 학습지</span>
      <button class="btn" id="ws-png">이 쪽 그림으로 저장</button>
      <button class="btn" id="ws-pdf">번역한 쪽 모두 PDF로 저장</button>
    </div>
    <div class="note" id="trnote"></div>
    <div class="tr-body" id="trbody"></div>
  </section>
</main>

<dialog id="dlg" aria-labelledby="dlg-h">
  <form id="dlg-form">
    <h2 id="dlg-h">글 붙여넣기</h2>
    <p>인터넷 글은 그 페이지에서 내용을 복사해 여기에 붙여 넣으세요. 이 칠판은 링크 주소만으로는 다른 사이트를 열 수 없습니다.</p>
    <label class="sr" for="dlg-text">붙여 넣을 글</label>
    <textarea id="dlg-text" rows="10" placeholder="여기에 한국어 글을 붙여 넣으세요"></textarea>
    <p class="note err" id="dlg-note" style="display:none"></p>
    <div class="group" style="justify-content:flex-end">
      <button class="btn" type="button" id="dlg-cancel">닫기</button>
      <button class="btn primary" type="submit">칠판에 올리기</button>
    </div>
  </form>
</dialog>
<dialog id="pdlg" aria-labelledby="pdlg-h">
  <form id="pdlg-form">
    <h2 id="pdlg-h">번역 결과 붙여넣기</h2>
    <p>JneGPT의 “이중언어 번역” 에이전트가 만든 결과를 복사해 여기에 붙여 넣으세요. 지금 보고 있는 쪽의 번역으로 들어갑니다.</p>
    <label class="sr" for="pdlg-text">번역 결과</label>
    <textarea id="pdlg-text" rows="10" placeholder="[S] 한국어 문장&#10;[T] 번역&#10;[V] 낱말 | 번역 | 풀이"></textarea>
    <p class="note err" id="pdlg-note" style="display:none"></p>
    <div class="group" style="justify-content:flex-end">
      <button class="btn" type="button" id="pdlg-cancel">닫기</button>
      <button class="btn primary" type="submit">이 쪽 번역으로 넣기</button>
    </div>
  </form>
</dialog>
<dialog id="qdlg" aria-labelledby="qdlg-h">
  <h2 id="qdlg-h">학생용 QR 코드</h2>
  <p>학생이 이 QR 코드를 찍으면 선생님이 보낸 쪽과 번역을 볼 수 있습니다. 먼저 이 페이지의 공유 설정을 “링크가 있는 모든 사용자”로 바꿔 주세요.</p>
  <div id="qr-box"></div>
  <p id="qr-url"></p>
  <div class="group" style="justify-content:flex-end"><button class="btn" type="button" id="qdlg-close">닫기</button></div>
</dialog>
</template>

var TF='"Noto Sans KR",system-ui,sans-serif';
function layoutText(str){
  var m=document.createElement("canvas").getContext("2d");m.font="34px "+TF;
  var lines=[],maxW=840;
  str.replace(/\r/g,"").split("\n").forEach(function(par){
    par=par.replace(/\s+$/,"");if(!par){lines.push({t:"",sep:"\n"});return;}
    var cur="",words=par.split(/( +)/);
    words.forEach(function(w){
      if(m.measureText(cur+w).width<=maxW){cur+=w;return;}
      if(cur.trim()){lines.push({t:cur.replace(/ +$/,""),sep:" "});cur="";}
      if(/^ +$/.test(w))return;
      while(m.measureText(w).width>maxW){var k=1;while(k<w.length&&m.measureText(w.slice(0,k+1)).width<=maxW)k++;lines.push({t:w.slice(0,k),sep:""});w=w.slice(k);}
      cur=w;
    });
    lines.push({t:cur.replace(/ +$/,""),sep:"\n"});
  });
  var pages=[];for(var i=0;i<lines.length;i+=22)pages.push(lines.slice(i,i+22));
  return pages;
}

}

function drawStroke(x,s,W){
  var p=s.pts;if(!p.length)return;
  x.save();x.lineCap="round";x.lineJoin="round";
  var lw=Math.max(1,s.size*W/1000);
  if(s.tool==="eraser"){x.globalCompositeOperation="destination-out";lw*=5;x.strokeStyle="#000";x.fillStyle="#000";}
  else{x.strokeStyle=s.color;x.fillStyle=s.color;if(s.tool==="hl"){x.globalAlpha=0.35;lw*=4;x.lineCap="butt";}}
  x.lineWidth=lw;
  var a=p[0],b=p[p.length-1];
  x.beginPath();
  if(s.tool==="line"){x.moveTo(a[0]*W,a[1]*W);x.lineTo(b[0]*W,b[1]*W);x.stroke();}
  else if(s.tool==="rect"){x.strokeRect(a[0]*W,a[1]*W,(b[0]-a[0])*W,(b[1]-a[1])*W);}
  else if(s.tool==="oval"){x.ellipse((a[0]+b[0])/2*W,(a[1]+b[1])/2*W,Math.abs(b[0]-a[0])/2*W,Math.abs(b[1]-a[1])/2*W,0,0,Math.PI*2);x.stroke();}
  else if(p.length===1){x.arc(a[0]*W,a[1]*W,lw/2,0,Math.PI*2);x.fill();}
  else{
    x.moveTo(a[0]*W,a[1]*W);
    for(var i=1;i<p.length-1;i++){var mx=(p[i][0]+p[i+1][0])/2*W,myy=(p[i][1]+p[i+1][1])/2*W;x.quadraticCurveTo(p[i][0]*W,p[i][1]*W,mx,myy);}
    x.lineTo(b[0]*W,b[1]*W);x.stroke();
  }
  x.restore();
}

function pt(e){var r=inkC.getBoundingClientRect();return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.width];}
inkC.addEventListener("pointerdown",function(e){
  if(S.tool==="hand"||(e.pointerType==="mouse"&&e.button!==0))return;
  e.preventDefault();try{inkC.setPointerCapture(e.pointerId);}catch(_){}
  live={tool:S.tool,color:S.color,size:S.size,pts:[pt(e)],id:e.pointerId};ask();

  if(!live||e.pointerId!==live.id)return;
  var evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];if(!evs.length)evs=[e];
  var shape=live.tool==="line"||live.tool==="rect"||live.tool==="oval";
  evs.forEach(function(ev){var q=pt(ev);
    if(shape){live.pts[1]=q;return;}
    var l=live.pts[live.pts.length-1];if(Math.abs(q[0]-l[0])+Math.abs(q[1]-l[1])>0.0012)live.pts.push(q);});

});

function parse(text){
  var pairs=[],vocab=[],cur=null,last=null;
  text.split(/\r?\n/).forEach(function(line){
    var m=line.match(/^\s*\[(S|E|T|V)\]\s*(.*)$/);
    if(!m){var t=line.trim();if(t&&cur&&last)cur[last]+=" "+t;return;}
    if(m[1]==="S"){cur={ko:m[2],tx:"",ez:""};pairs.push(cur);last="ko";}
    else if(m[1]==="E"){if(cur){cur.ez=m[2];last="ez";}}
    else if(m[1]==="T"){if(!cur){cur={ko:"",tx:"",ez:""};pairs.push(cur);}cur.tx=m[2];last="tx";}
    else{var c=m[2].split("|").map(function(s){return s.trim();});if(c[0])vocab.push([c[0],c[1]||"",c[2]||""]);cur=null;last=null;}
  });
  return {pairs:pairs,vocab:vocab};
}

  var e={status:"loading",pairs:[],vocab:[]};S.tr.set(k,e);if(!bg)S.auto=true;if(key()===k)showTr();

    var hangul=(text.match(/[가-힣]/g)||[]).length;
    if((S.kind==="pdf"||S.kind==="img")&&canImages&&(forceImage||hangul<20)){useImg=true;opts.images=[await pageBlob(p)];}
    else if(!text){throw {code:"no_text"};}

    var c=err&&err.code,m="번역하지 못했습니다. 잠시 뒤 “이 쪽 번역하기”를 다시 눌러 주세요.";

    else if(c==="rate_limited")m="요청이 잠시 몰렸습니다. 1분쯤 뒤에 다시 눌러 주세요.";
    else if(c==="no_text"&&S.kind==="img")m="이 화면에서는 사진 속 글자를 읽을 수 없습니다. Claude 안에서 열어 다시 눌러 주세요.";
    else if(c==="no_text")m="이 쪽에서 글자를 찾지 못했습니다. 사진을 스캔한 PDF라면 “그림으로 읽어 번역”을 눌러 보세요.";
    else if(c==="empty")m="이 쪽에서 번역할 문장을 찾지 못했습니다."+(canImages&&S.kind==="pdf"?" “그림으로 읽어 번역”을 눌러 보세요.":"");
    if(c==="not_granted"||c==="rate_limited")S.auto=false;

function wrap(x,text,maxW){
  var out=[],cur="";
  String(text).split(/( +)/).forEach(function(w){
    if(x.measureText(cur+w).width<=maxW){cur+=w;return;}
    if(cur.trim()){out.push(cur.trim());cur="";}
    if(/^ +$/.test(w))return;
    if(x.measureText(w).width>maxW){var cs=chars(w),part="";
      cs.forEach(function(ch){if(part&&x.measureText(part+ch).width>maxW){out.push(part);part=ch;}else part+=ch;});w=part;}
    cur=w;
  });
  if(cur.trim())out.push(cur.trim());return out;
}

    await render();showTr();
    if(SHARED&&SHARED.pages)setNote($("docnote"),S.name+" · 학생 화면에 "+SHARED.pages.length+"쪽을 보냈습니다. 학생 화면이 안 바뀌면 새로 고침을 하게 해 주세요.");
  }catch(e){}
}
async function sendToStudents(){
  if(!artifactCap||sending)return;
  sending=true;$("send").disabled=true;setNote($("docnote"),"학생 화면으로 보내는 중… 잠깐 화면이 다시 열립니다.");
  try{
    var p=S.cur,e=S.tr.get(key()),c=await pageCanvas(p,1100),id=S.name+"|"+S.n;
    var sh=(SHARED&&SHARED.id===id&&SHARED.lang===S.lang)?JSON.parse(JSON.stringify(SHARED)):{id:id,name:S.name,lang:S.lang,pages:[]};
    sh.pages=sh.pages.filter(function(x){return x.n!==p;});
    sh.pages.push({n:p,img:c.toDataURL("image/jpeg",0.8),pairs:e&&e.status==="done"?e.pairs:[],vocab:e&&e.status==="done"?e.vocab:[]});
    sh.pages.sort(function(a,b){return a.n-b.n;});sh.cur=p;sh.ts=Date.now();
    while(JSON.stringify(sh).length>11000000&&sh.pages.length>1){var k=sh.pages[0].n===p?1:0;sh.pages.splice(k,1);}
    await stash();
    try{localStorage.setItem("bb-teacher","1");}catch(_){}
    await artifactCap.publish(compose(sh));
    SHARED=sh;setNote($("docnote"),"학생 화면으로 "+p+"쪽을 보냈습니다.");
  }catch(err){
    var c2=err&&err.code,m="보내지 못했습니다. 잠시 뒤 다시 눌러 주세요.";
    if(c2==="not_writer"||c2==="not_granted"||c2==="not_declared"||c2==="capability_disabled")m="이 화면에서는 학생에게 보낼 수 없습니다. 페이지를 만든 선생님 계정으로 열어 주세요.";
    else if(c2==="too_large")m="자료가 너무 커서 보내지 못했습니다. 쪽 수가 적은 자료로 다시 해 주세요.";
    else if(c2==="rate_limited")m="너무 자주 보냈습니다. 조금 뒤에 다시 눌러 주세요.";
    else if(c2==="conflict")m="방금 다른 곳에서 먼저 보냈습니다. 화면이 다시 열리면 한 번 더 눌러 주세요.";
    setNote($("docnote"),m,true);
  }
  sending=false;$("send").disabled=false;
}
$("send").addEventListener("click",sendToStudents);
var qdlg=$("qdlg");
$("qr-btn").addEventListener("click",function(){
  var box=$("qr-box");box.textContent="";
  try{var q=qrcode(0,"M");q.addData(SHARE_URL);q.make();box.innerHTML=q.createSvgTag(6,12);}
  catch(e){box.textContent="QR 코드를 만들지 못했습니다. 아래 주소를 알려 주세요.";}
  $("qr-url").textContent=SHARE_URL;
  if(qdlg.showModal)qdlg.showModal();else qdlg.setAttribute("open","");
});
$("qdlg-close").addEventListener("click",function(){if(qdlg.close)qdlg.close();else qdlg.removeAttribute("open");});
function loadImgUrl(u){return new Promise(function(res,rej){var im=new Image();im.onload=function(){res(im);};im.onerror=function(){rej(new Error("img"));};im.src=u;});}
async function startStudent(){
  student=true;document.body.classList.add("student");
  S.lang=SHARED.lang||S.lang;$("lang").value=S.lang;
  var imgs=[],pages=[];
  for(var i=0;i<SHARED.pages.length;i++){try{imgs.push(await loadImgUrl(SHARED.pages[i].img));pages.push(SHARED.pages[i]);}catch(e){}}
  if(!imgs.length){student=false;document.body.classList.remove("student");startTeacher();return;}
  await opened("img",SHARED.name||"선생님이 보낸 자료",imgs.length,function(){S.imgs=imgs;});
  var at=1;
  pages.forEach(function(pg,i){
    if(pg.pairs&&pg.pairs.length)S.tr.set(keyOf(i+1),{status:"done",pairs:pg.pairs,vocab:pg.vocab||[]});
    if(pg.n===SHARED.cur)at=i+1;
  });
  S.cur=at;await render();showTr();
  setNote($("docnote"),"선생님이 보낸 자료예요 · "+imgs.length+"쪽");
}
function startTeacher(){
  S.pdf=null;S.imgs=[];S.tpages=[];S.src=null;S.kind="demo";S.name="예시 자료";S.n=1;S.cur=1;S.zoom=1;S.ink=new Map();S.tr=new Map();
  S.tr.set(keyOf(1).replace(/\|[^|]*\|/,"|vi|"),DEMO_VI);
  setNote($("docnote"),"예시 자료 · PDF나 사진을 올리거나, 카메라로 찍거나, 글을 붙여 넣으세요.");
  render();showTr();
}
$("teach-btn").addEventListener("click",function(){student=false;document.body.classList.remove("student");startTeacher();showCaps();});
function showCaps(){$("send").hidden=!artifactCap||student;$("qr-btn").hidden=!artifactCap||student;$("save").hidden=!downloads;showTr();}

/* ---------- 시작 ---------- */
var teacherDevice=false;try{teacherDevice=localStorage.getItem("bb-teacher")==="1";}catch(e){}
if(SHARED&&SHARED.pages&&SHARED.pages.length&&!teacherDevice)startStudent();
else{startTeacher();if(SHARED)restore();}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){if(S.kind==="demo"||S.kind==="text")render();});
if(window.claude&&window.claude.use){
  window.claude.use("sample").then(async function(s){sample=s||null;
    if(sample&&sample.limits){try{canImages=!!(await sample.limits()).images;}catch(e){}}
    showTr();});
  window.claude.use("downloads").then(function(d){downloads=d||null;showCaps();});
  window.claude.use("artifact").then(function(a){artifactCap=a||null;showCaps();});
}
})();
</script>
